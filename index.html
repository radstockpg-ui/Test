function getVideoId(url) {
  if (!url) return null;
  if (url.includes("shorts/")) return url.split("shorts/")[1].split("?")[0];
  const m = url.match(/[?&]v=([^&]+)/);
  return m ? m[1] : null;
}

function InlinePlayer({ vid, onClose }) {
  const id = getVideoId(vid?.url);
  if (!id) return null;
  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <div style={{ color: C.vid, fontSize: 11, fontWeight: 700, lineHeight: 1.3, flex: 1, paddingRight: 8 }}>{vid.label}</div>
        <button onClick={onClose} style={{ background: "#2a2a2a", border: "none", color: C.muted, borderRadius: 6, padding: "4px 10px", fontSize: 12, cursor: "pointer" }}>✕ Close</button>
      </div>
      <div style={{ position: "relative", width: "100%", paddingBottom: "56.25%", background: "#000", borderRadius: 10, overflow: "hidden" }}>
        <iframe
          src={`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`}
          title={vid.label}
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowFullScreen
          style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", border: "none" }}
        />
      </div>
    </div>
  );
}

function PlayButton({ vid, activeVid, setActiveVid }) {
  if (!vid) return null;
  const isPlaying = activeVid?.url === vid.url;
  return (
    <div>
      <button onClick={() => setActiveVid(isPlaying ? null : vid)} style={{ display: "flex", alignItems: "center", gap: 10, background: isPlaying ? C.vid + "25" : C.vid + "12", border: `1px solid ${isPlaying ? C.vid + "70" : C.vid + "35"}`, borderRadius: 9, padding: "10px 13px", marginTop: 10, cursor: "pointer", width: "100%", textAlign: "left" }}>
        <div style={{ width: 34, height: 34, borderRadius: "50%", background: C.vid + "30", border: `1px solid ${C.vid}60`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <span style={{ color: C.vid, fontSize: isPlaying ? 12 : 15, marginLeft: isPlaying ? 0 : 3 }}>{isPlaying ? "■" : "▶"}</span>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ color: C.vid, fontSize: 12, fontWeight: 600, lineHeight: 1.3 }}>{isPlaying ? "Close player" : vid.label}</div>
          <div style={{ color: C.vid + "80", fontSize: 10, marginTop: 2 }}>{isPlaying ? "Tap to close" : `${vid.source} · plays here`}</div>
        </div>
      </button>
      {isPlaying && <InlinePlayer vid={vid} onClose={() => setActiveVid(null)} />}
    </div>
  );
}

              <div style={{ width: 28, height: 28, borderRadius: "50%", background: C.pull + "20", color: C.pull, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, flexShrink: 0 }}>{i + 1}</div>
              <div>
                <div style={{ fontWeight: 600, fontSize: 14, color: C.text, marginBottom: 2 }}>{s.name}</div>
                <div style={{ color: C.pull, fontSize: 11, marginBottom: 5 }}>{s.dur}</div>
                <div style={{ color: C.muted, fontSize: 12, lineHeight: 1.5 }}>{s.note}</div>
              </div>
            </div>
          ))}
        </div>
      )}
      {section === "tempo" && (
        <div style={{ padding: 16 }}>
          <div style={{ background: "#0a0a1a", border: `1px solid #1e1e3a`, borderRadius: 8, padding: "10px 12px", marginBottom: 14 }}>
            <div style={{ color: "#818cf8", fontSize: 12, lineHeight: 1.6 }}>Format: <strong style={{ color: "#a5b4fc" }}>Eccentric → Pause (bottom) → Concentric → Pause (top)</strong><br />Each digit = seconds. <strong style={{ color: "#a5b4fc" }}>X</strong> = explosive. <strong style={{ color: "#a5b4fc" }}>0</strong> = no pause.</div>
          </div>
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
            {tempoGuide.map((t, i) => (
              <div key={i} style={{ padding: "13px 14px", borderBottom: i < tempoGuide.length - 1 ? `1px solid ${C.border}` : "none", display: "flex", gap: 12, alignItems: "flex-start" }}>
                <span style={{ color: C.push, fontWeight: 800, fontSize: 13, fontFamily: "monospace", minWidth: 60 }}>{t.code}</span>
                <span style={{ color: C.muted, fontSize: 12, lineHeight: 1.5 }}>{t.desc}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      {section === "rules" && (
        <div style={{ padding: 16 }}>
          {guidelines.map((g, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderLeft: `3px solid ${g.color}`, borderRadius: 10, padding: "13px 16px", marginBottom: 9 }}>
              <div style={{ color: g.color, fontWeight: 700, fontSize: 13, marginBottom: 5 }}>{g.title}</div>
              <div style={{ color: C.muted, fontSize: 13, lineHeight: 1.6, whiteSpace: "pre-line" }}>{g.body}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("schedule");
  const [activeVid, setActiveVid] = useState(null);

  const tabs = [
    { id: "schedule", label: "Week" },
    { id: "push1", label: "Push 1" },
    { id: "pull1", label: "Pull 1" },
    { id: "push2", label: "Push 2" },
    { id: "pull2", label: "Pull 2" },
    { id: "swim", label: "🏊 Swim" },
    { id: "videos", label: "▶ Videos" },
    { id: "guide", label: "Guide" },
  ];
  const ringTabs = ["push1", "pull1", "push2", "pull2"];

  function accentFor(id) {
    if (id === "videos") return C.vid;
    if (id === "swim" || id === "schedule") return C.swim;
    return C.push;
  }

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif", maxWidth: 500, margin: "0 auto" }}>
      <div style={{ padding: "20px 16px 14px", borderBottom: `1px solid ${C.border}`, background: "#0b0b0b" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontSize: 10, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 3 }}>Rings + Swimming</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: C.text, letterSpacing: -0.5 }}>Training Plan</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ color: C.push, fontSize: 11, fontWeight: 700 }}>RINGS P1</div>
            <div style={{ color: C.swim, fontSize: 11, fontWeight: 700 }}>SWIM 8 WK</div>
          </div>
        </div>
        <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 6 }}>
          <Pill color={C.push}>4 ring days</Pill>
          <Pill color={C.swim}>1–2 swims</Pill>
          <Pill color={C.vid}>20 videos</Pill>
          <Pill color={C.core}>+ hollow body</Pill>
        </div>
      </div>

      <div className="scroll-x" style={{ background: "#0b0b0b", borderBottom: `1px solid ${C.border}` }}>
        <div style={{ display: "flex" }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: "11px 12px", background: "none", border: "none", borderBottom: tab === t.id ? `2px solid ${accentFor(t.id)}` : "2px solid transparent", color: tab === t.id ? (t.id === "videos" ? C.vid : C.text) : (t.id === "videos" ? C.vid + "70" : C.muted), fontSize: 12, fontWeight: tab === t.id ? 700 : 400, cursor: "pointer", whiteSpace: "nowrap", transition: "color 0.15s" }}>{t.label}</button>
          ))}
        </div>
      </div>

      <div>
        {tab === "schedule" && <ScheduleView onNav={setTab} activeVid={activeVid} setActiveVid={setActiveVid} />}
        {ringTabs.includes(tab) && <SessionView sk={tab} activeVid={activeVid} setActiveVid={setActiveVid} />}
        {tab === "swim" && <SwimPhaseView />}
        {tab === "videos" && <AllVideosView activeVid={activeVid} setActiveVid={setActiveVid} />}
        {tab === "guide" && <GuideView />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
